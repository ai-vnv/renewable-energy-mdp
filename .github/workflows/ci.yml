name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests (both MDPs x every shared solver)
        run: python -m unittest discover -s tests -v

      - name: Driver smoke run (fast solvers, tiny budget)
        run: |
          python run_unified.py Random US 2 5
          python run_unified.py EquityGreedy ID 2 5
          python run_cross.py greedy equity US 2 5

      - name: Figure generation
        run: python make_unified_figure.py
